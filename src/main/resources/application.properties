spring.application.name=scan-and-go-api

# Server settings
server.port=${PORT:8080}

# Database Configurations
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/scan_and_go_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1111}

# JPA Configurations - schema is owned by Flyway migrations, never auto-generated
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# JWT - RSA key pair (PEM), generate with:
#   openssl genrsa -out private.pem 2048
#   openssl rsa -in private.pem -pubout -out public.pem
# In cloud deployments (no gitignored key file present in the built image),
# set JWT_PRIVATE_KEY_PEM / JWT_PUBLIC_KEY_PEM to the full PEM text instead -
# these take precedence over the path-based properties when set.
app.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:classpath:keys/private.pem}
app.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:classpath:keys/public.pem}
app.jwt.private-key-pem=${JWT_PRIVATE_KEY_PEM:}
app.jwt.public-key-pem=${JWT_PUBLIC_KEY_PEM:}
app.jwt.access-token-ttl-minutes=${JWT_ACCESS_TTL_MIN:60}
app.jwt.refresh-token-ttl-days=${JWT_REFRESH_TTL_DAYS:14}

# QR code signing (HMAC-SHA256 over the public token, dev-only secret below)
app.qr.hmac-secret=${QR_HMAC_SECRET:37b2509dce055917ec6a2bf213bc240e1b51d27f3b4d6db6e384447ed414b19b}
app.qr.base-uri=${QR_BASE_URI:SCAN_GO://P/}

# Optional: CORS configuration for production
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}